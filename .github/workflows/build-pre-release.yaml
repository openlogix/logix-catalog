# Checks the catalog, packs it as logix-catalog (tools/package.py) and
# publishes it as a GitHub pre-release tagged with the date (yyyy-mm-dd).
# A pre-release with the same tag is replaced, so the day's pre-release is
# from its latest commit; a stable release with that tag is never touched
# (the run fails instead).
#
# Runs on every push to main, daily and manually, like every Open Logix
# pre-release build. Old pre-releases are deleted by the shared policy;
# an engine release that ships pins a stable release (pre-release
# unticked), which is never deleted.
#
# The shared parts are Open Logix actions in openlogix/.github (tested
# there): start-pre-release and publish-pre-release, which also writes the
# standard release text and applies the pre-release policy.

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, so breakage from GitHub's runners or upstream
  # changes shows up even when nothing here changes.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pre-release
  cancel-in-progress: true

jobs:
  pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the catalog
        run: scripts/test.sh

      # The build details go in BUILD-INFO.json, beside the package, not
      # inside it: the package stays reproducible.
      - name: Start the pre-release
        uses: openlogix/.github/actions/start-pre-release@main
        with:
          package-name: logix-catalog
          description: Logix Catalog's boards and FPGAs, as Logix Engine downloads them.

      - name: Pack the catalog
        run: python3 tools/package.py --out _out --package-tag "$PACKAGE_TAG"

      - name: Write the release content
        run: |
          cat > CONTENT.md <<EOF
          Each release is one package, \`logix-catalog-${PACKAGE_TAG}.tgz\`: the board files, the FPGA files and their schemas, which Logix Engine downloads.
          EOF

      - name: Publish the pre-release
        uses: openlogix/.github/actions/publish-pre-release@main
        with:
          title: "Logix Catalog: Every FPGA board, described once."
          links: "[Main page](https://www.openlogix.org/catalog/) · [Docs](https://www.openlogix.org/logix-catalog/)"
          engine-note: catalog
          content-file: CONTENT.md
          about-bullets: An engine release that ships pins a stable release, which is never deleted.
          files: |
            _out/logix-catalog-${{ env.PACKAGE_TAG }}.tgz
