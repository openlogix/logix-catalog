# Checks the catalog, packs it as logix-catalog (tools/package.py) and
# publishes it as a GitHub pre-release tagged with the date (yyyy-mm-dd).
# A pre-release with the same tag is replaced, so the day's pre-release is
# from its latest commit; a stable release with that tag is never touched
# (the run fails instead).
#
# Runs on every push to main, daily and manually, like every Open Logix
# pre-release build, and keeps the 5 newest pre-releases (the shared
# cleanup action). An engine release that ships pins a stable release
# (pre-release unticked), which the cleanup never deletes.
#
# The steps use the shared Open Logix actions in openlogix/.github.

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, so breakage from GitHub's runners or upstream
  # changes shows up even when nothing here changes.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pre-release
  cancel-in-progress: true

env:
  RELEASE_TAG: ""
  PACKAGE_TAG: ""
  REPO: ""
  REPO_BRANCH: ""
  REPO_COMMIT: ""

jobs:
  pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the catalog
        run: scripts/test.sh

      - name: Get release and package tags
        uses: openlogix/.github/actions/get-release-and-package-tags@v1
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG

      - name: Ensure no conflicting release
        uses: openlogix/.github/actions/ensure-no-conflicting-release@v1
        with:
          release-tag: ${{ env.RELEASE_TAG }}

      - name: Get repo info
        uses: openlogix/.github/actions/get-repo-info@v1
        with:
          repo-dir: .
          repo-var: REPO
          branch-var: REPO_BRANCH
          commit-var: REPO_COMMIT

      - name: Pack the catalog
        run: python3 tools/package.py --out _out --package-tag "$PACKAGE_TAG"

      # The build details live here, beside the package, not inside it: the
      # package stays reproducible.
      - name: Create build info
        run: |
          cat > BUILD-INFO.json <<EOT
          {
            "package-name": "logix-catalog",
            "description": "Logix Catalog's boards and FPGAs, as Logix Engine downloads them.",
            "repo": "${REPO}",
            "repo-branch": "${REPO_BRANCH}",
            "repo-commit": "${REPO_COMMIT}",
            "release-tag": "$RELEASE_TAG",
            "package-tag": "$PACKAGE_TAG",
            "build-time": "$(date +'%Y-%m-%d %H:%M:%S %Z')",
            "builder-workflow": "${{ github.workflow }}",
            "workflow-run-id": "${{ github.run_id }}",
            "workflow-run-number": "${{ github.run_number }}"
          }
          EOT

      - name: Format build info json file in-place
        uses: openlogix/.github/actions/format-json-file@v1
        with:
          json-file: BUILD-INFO.json

      - name: Convert json build info to text
        uses: openlogix/.github/actions/json-to-text@v1
        with:
          input-json: BUILD-INFO.json
          output-text: build-info.txt

      - name: Prepare release text
        run: |
          cd _out && sha256sum logix-catalog-*.tgz > ../SHA256SUMS && cd ..
          cat > RELEASE-BODY.txt <<EOT

          **Logix Catalog: every FPGA board, described once.**

          This is the catalog package Logix Engine downloads. Tools are
          intended to get this data through
          [Logix Engine](https://www.openlogix.org/engine/)'s API; the
          files' layout may change between releases.

          ### Checksums

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`

          ### Build info

          \`\`\`
          $(cat build-info.txt)
          \`\`\`
          EOT
          cat -n RELEASE-BODY.txt

      - name: Cleanup old pre-releases
        uses: openlogix/.github/actions/cleanup-old-prereleases@v1

      - name: Create GitHub pre-release
        uses: openlogix/.github/actions/create-pre-release@v1
        with:
          release_tag: ${{ env.RELEASE_TAG }}
          body_path: RELEASE-BODY.txt
          files: |
            _out/logix-catalog-${{ env.PACKAGE_TAG }}.tgz
            SHA256SUMS
            BUILD-INFO.json
